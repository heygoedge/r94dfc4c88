<!doctype html>
<html lang="zh-CN" data-v="20261118f"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heygo"><meta name="application-name" content="Heygo">
<meta name="format-detection" content="telephone=no,email=no,address=no"><meta name="theme-color" content="#0B1030">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<title>Heygo</title>
<link rel="stylesheet" href="app.css?v=20261118f">
</head>
<body data-phase="boot">
<canvas id="stage" aria-label="滑行三维回放" role="img"></canvas>
<div id="labels" aria-hidden="true"></div>
<header class="top">
  <button id="pick" class="glass pill" aria-label="选择回放"><span><b id="who">—</b><small id="seg">—</small></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
  <button id="reset" class="glass round" aria-label="复位视角" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8a8 8 0 1 1-1 8M5 3v5h5"/></svg></button>
</header>
<div id="speedfx" aria-hidden="true"><i></i><i></i></div>
<div id="callout" role="status"></div>
<div id="streak" aria-live="polite"></div>
<section id="intro" aria-label="片头"></section>
<section class="hud" aria-label="回放控制">
  <div id="chip"></div>
  <div class="dock">
    <div class="metrics">
      <div class="m main"><b id="m-speed">–</b><span><i>km/h</i><em>速度</em></span><u id="m-bar" aria-hidden="true"><s></s></u></div>
      <div class="m"><svg id="tilt" viewBox="-14 -14 28 28" aria-hidden="true"><rect x="-11" y="-1.6" width="22" height="3.2" rx="1.6"/></svg><b id="m-edge">–</b><span><i id="m-edge-unit">°</i><em id="m-edge-label">立刃</em></span></div>
      <div class="m"><b id="m-g">–</b><span><i id="m-g-unit">G</i><em id="m-g-label">G 值</em></span></div>
    </div>
    <div class="transport">
      <button id="play" aria-label="播放" data-playing="false"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11.3-6.8a1 1 0 0 0 0-1.72L9.5 4.34A1 1 0 0 0 8 5.2Z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg></button>
      <div class="tlwrap"><div id="timeline" role="slider" aria-label="回放进度"><canvas id="tl-canvas"></canvas><div id="tl-played"><canvas></canvas></div><div id="tl-head"></div></div><div class="times"><span id="time">0.0 s</span><span class="slow">慢动作</span><span id="dur">–</span></div></div>
      <button id="rate" aria-label="倍速">1×</button>
    </div>
  </div>
</section>
<section id="summary" aria-label="本段摘要" hidden></section>
<div id="sheet" hidden></div>
<div id="app-splash" role="status" aria-live="polite"><img src="icon-180.png" alt="" width="84" height="84"><strong>Heygo</strong><div class="bar"><i></i></div><p data-splash-text>正在载入滑行数据…</p><button type="button" data-splash-retry>重新载入</button></div>
<script>
(function(){var s=document.getElementById('app-splash'),t=s.querySelector('[data-splash-text]');
 window.HG_SPLASH_FAIL=function(m){if(document.documentElement.classList.contains('app-ready'))return;s.classList.add('is-error');t.textContent=m||'载入失败，请检查网络后重试';};
 s.querySelector('[data-splash-retry]').addEventListener('click',function(){location.reload();});
 window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT')window.HG_SPLASH_FAIL();},true);
})();
</script>
<script src="app.js?v=20261118f"></script>
</body></html>
